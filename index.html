<!DOCTYPE html><html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JABBAAR LIFE OS</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#000052;--mu:#6b7280;--bd:#e4e7f0;--pr:#0000ff;--nv:#000052;--soft:#eaeaff;--ok:#12b76a;--wr:#f79009;--rd:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=dark]{--bg:#00001c;--card:#0a0a40;--tx:#f1f2ff;--mu:#9aa0c8;--bd:#1a1a5c;--soft:#14146a;--pr:#4d4dff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.side{display:none}.bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));z-index:20}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--mu);padding:5px 0;border-radius:10px;transition:.2s}.nv span{font-size:18px}.nv.on{color:var(--pr);font-weight:700}
main{padding:16px 14px 100px;max-width:920px;margin:0 auto}
@media(min-width:900px){.side{display:flex;position:fixed;left:0;top:0;bottom:0;width:230px;flex-direction:column;gap:4px;background:var(--nv);color:#fff;padding:22px 14px}.bn{display:none}main{margin-left:230px;max-width:none;padding:28px 32px}main>.v{max-width:900px;margin:auto}
.side .nv{flex-direction:row;gap:10px;font-size:14px;color:#c9caff;padding:10px 12px}.side .nv.on{background:var(--pr);color:#fff}.side .nv:hover{background:rgba(255,255,255,.1)}}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px;margin-bottom:16px}.logo b{color:#8b8bff}
.v>*{animation:up .4s both}.v>*:nth-child(2){animation-delay:.05s}.v>*:nth-child(3){animation-delay:.1s}.v>*:nth-child(4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes pop{50%{transform:scale(1.25)}}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:18px 0 10px}
.hero{background:linear-gradient(135deg,#000052,#0000ff);color:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,255,.25)}
.hero small{opacity:.8}.hero h1{margin:2px 0 4px;font-size:24px}.big{font-size:44px;font-weight:800;line-height:1}
.bar{height:10px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar.l{background:var(--soft)}.bar.l i{background:linear-gradient(90deg,var(--pr),#6b6bff)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.st b{display:block;font-size:26px}.st span{color:var(--mu);font-size:12px}
.tk{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px;margin-bottom:8px;transition:.2s}.tk:hover{border-color:var(--pr)}
.tk.dn .tb b{text-decoration:line-through;color:var(--mu)}.tb{flex:1;min-width:0}.tb b{overflow-wrap:anywhere}
.ck{width:26px;height:26px;flex:none;border:2px solid var(--pr);border-radius:8px;color:#fff;font-weight:800;display:grid;place-items:center;transition:.2s}.dn .ck{background:var(--pr);animation:pop .3s}
.mt{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;color:var(--mu)}.ch{background:var(--soft);color:var(--pr);border-radius:20px;padding:1px 8px}
.pr{border-radius:20px;padding:1px 8px;color:#fff}.p2{background:var(--rd)}.p1{background:var(--wr)}.p0{background:var(--ok)}.nt{margin:5px 0 0;font-size:13px;color:var(--mu);overflow-wrap:anywhere}
.ib{width:32px;height:32px;border-radius:8px;flex:none}.ib:hover{background:var(--soft)}
.btn{background:var(--pr);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;transition:.2s}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}.btn.g{background:var(--soft);color:var(--pr)}.btn.d{background:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sb{justify-content:space-between}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:10px 12px;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--pr)}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:10px 0 4px}.er{color:var(--rd);font-size:12px;min-height:16px}
.emp{text-align:center;padding:30px 16px;border:2px dashed var(--bd);border-radius:18px;color:var(--mu)}.emp span{font-size:42px;display:block;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.chips button{flex:none;border:1.5px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:13px;background:var(--card)}.chips .on{background:var(--pr);border-color:var(--pr);color:#fff}
.ov{position:fixed;inset:0;background:rgba(0,0,40,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}.md{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto;animation:up .3s}
@keyframes fade{from{opacity:0}}@media(min-width:600px){.ov{align-items:center}.md{border-radius:22px}}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:var(--pr);color:#fff;font-size:28px;box-shadow:0 8px 20px rgba(0,0,255,.4);z-index:15}
@media(min-width:900px){.fab{bottom:28px;right:32px}}
.bars{display:flex;gap:8px;align-items:flex-end;height:150px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}.bars i{display:block;width:100%;border-radius:8px 8px 0 0;background:linear-gradient(var(--pr),#6b6bff);transition:height .9s cubic-bezier(.2,.8,.2,1);height:0;min-height:3px}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.hm i{aspect-ratio:1;border-radius:6px;background:var(--soft);display:grid;place-items:center;font-size:10px;font-style:normal;color:var(--tx)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal small{color:var(--mu);font-size:11px}.cal button{aspect-ratio:1;border-radius:10px;background:var(--bg);font-size:13px;position:relative;border:1.5px solid transparent}.cal .on{border-color:var(--pr);font-weight:800}.cal .td{background:var(--pr);color:#fff}
.cal button u{position:absolute;bottom:3px;left:25%;right:25%;height:4px;border-radius:4px;background:var(--ok);text-decoration:none}
.tg{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--nv);color:#fff;padding:9px 18px;border-radius:20px;z-index:99;animation:up .3s;font-size:14px}
.cb{display:flex;align-items:center;gap:8px;margin:6px 0}.cb span{width:110px;font-size:13px}.cb .bar{flex:1;margin:0}.cb em{font-style:normal;width:40px;text-align:right;font-size:12px;color:var(--mu)}
</style></head><body>
<aside class="side"><div class="logo">JABBAAR <b>LIFE OS</b></div><div id="sn"></div></aside>
<main id="main"></main><nav class="bn" id="bn"></nav><div id="mdl"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const K='jabbaarLifeOS.v1',$=s=>document.querySelector(s);
const CATS=[['Deen','🕌'],['Quraan','📖'],['Dugsi','🎓'],['Ganacsi','💼'],['Naqshadeynta Garaafiga','🎨'],['Tafatirka Muuqaalka','🎬'],['Jimicsi','🏋️'],['Qoys','👨‍👩‍👧'],['Horumarinta Naftaada','🌱']];
const PR=['Hoose','Dhexe','Sare'],DAYS=['Axad','Isniin','Talaado','Arbaco','Khamiis','Jimce','Sabti'],MON=['Janaayo','Febraayo','Maarso','Abriil','May','Juun','Luuliyo','Ogosto','Sebtembar','Oktoobar','Nofembar','Diseembar'];
const NAV=[['dash','🏠','Hoyga'],['plan','📋','Qorshe'],['morn','🌅','Subax'],['night','🌙','Habeen'],['stat','📊','Falanqayn'],['cal','🗓','Kalandar'],['set','⚙️','Dejin']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(a,b-1,c)},fmt=s=>{const d=pd(s);return DAYS[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),TODAY=()=>ymd(new Date());
function load(){try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.tasks)return r}catch(e){}return{tasks:[],goals:{},reviews:{},settings:{theme:'auto',name:'Jabbaar',cloudUrl:'',cloudKey:'',cloudId:''}}}
let S=load();
if(!S.settings)S.settings={theme:'auto',name:'Jabbaar'};
S.settings.cloudUrl=S.settings.cloudUrl||'';S.settings.cloudKey=S.settings.cloudKey||'';S.settings.cloudId=S.settings.cloudId||'';
let cloudClient=null,cloudTimer=null,cloudBusy=false;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));scheduleCloudPush()}catch(e){toast('Xogta lama keydin karo')};};
let view='dash',selD=TODAY(),cm=new Date(),filt='all',modal=null,calSel=TODAY();
function initCloud(){
 const s=S.settings||{},u=s.cloudUrl?.trim(),k=s.cloudKey?.trim(),id=s.cloudId?.trim();
 cloudClient=null;
 if(!u||!k||!id||!window.supabase)return false;
 try{cloudClient=window.supabase.createClient(u,k,{auth:{persistSession:false,autoRefreshToken:false}});return true}catch(e){return false}
}
async function pullCloud(){
 if(!initCloud()||cloudBusy)return;
 cloudBusy=true;
 const id=S.settings.cloudId;
 try{
  const {data,error}=await cloudClient.from('life_os_state').select('data,updated_at').eq('id',id).maybeSingle();
  if(error)throw error;
  if(data&&data.data){
   const remote=data.data;
   const remoteAt=remote._cloudUpdatedAt||data.updated_at||'';
   const localAt=S._cloudUpdatedAt||'';
   if(!localAt||(remoteAt&&remoteAt>localAt)){S=remote;S._cloudUpdatedAt=remoteAt;localStorage.setItem(K,JSON.stringify(S));render()}
  }else{await pushCloud(true)}
 }catch(e){toast('Sync lama soo dejin: '+(e.message||'cilad'))}
 cloudBusy=false;
}
async function pushCloud(silent=false){
 if(!initCloud()||cloudBusy)return;
 cloudBusy=true;
 S._cloudUpdatedAt=new Date().toISOString();
 try{
  localStorage.setItem(K,JSON.stringify(S));
  const {error}=await cloudClient.from('life_os_state').upsert({id:S.settings.cloudId,data:S,updated_at:S._cloudUpdatedAt},{onConflict:'id'});
  if(error)throw error;
  if(!silent)toast('Sync waa la cusbooneysiiyay ☁️');
 }catch(e){toast('Sync lama keydin: '+(e.message||'cilad'))}
 cloudBusy=false;
}
function scheduleCloudPush(){
 if(!initCloud())return;
 clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>pushCloud(true),700);
}
const on=d=>S.tasks.filter(t=>t.date===d),pc=a=>a.length?Math.round(a.filter(t=>t.done).length/a.length*100):0;
const days=n=>[...Array(n)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return ymd(d)});
function streak(){let s=0;for(let i=0;i<400;i++){const d=new Date();d.setDate(d.getDate()-i);const t=on(ymd(d));if(t.some(x=>x.done))s++;else if(i>0)break}return s}
function toast(m){const e=document.createElement('div');e.className='tg';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
const bar=(p,l)=>`<div class="bar ${l?'l':''}"><i data-w="${p}"></i></div>`;
const catL=i=>CATS[i]?CATS[i][1]+' '+CATS[i][0]:'';
const row=t=>`<div class="tk ${t.done?'dn':''}"><button class="ck" data-a="tg" data-id="${t.id}" aria-label="Dhammaystir">${t.done?'✓':''}</button><div class="tb"><b>${esc(t.title)}</b><div class="mt"><span class="ch">${catL(t.cat)}</span><span class="pr p${t.pri}">${PR[t.pri]}</span>${t.time?`<span>⏰ ${t.time}</span>`:''}</div>${t.notes?`<p class="nt">${esc(t.notes)}</p>`:''}</div><button class="ib" data-a="ed" data-id="${t.id}" aria-label="Wax ka beddel">✎</button><button class="ib" data-a="dl" data-id="${t.id}" aria-label="Tirtir">🗑</button></div>`;
const sortT=a=>[...a].sort((x,y)=>x.done-y.done||(x.time||'99').localeCompare(y.time||'99')||y.pri-x.pri);
const empty=(i,t,s,b)=>`<div class="emp"><span>${i}</span><b>${t}</b><p>${s}</p>${b||''}</div>`;
const V={
dash(){const d=TODAY(),t=on(d),dn=t.filter(x=>x.done).length,p=pc(t),h=new Date().getHours(),g=h<12?'Subax wanaagsan':h<18?'Galab wanaagsan':'Fiid wanaagsan',pen=sortT(t).filter(x=>!x.done);
return`<div class="v"><div class="hero"><small>${fmt(d)}</small><h1>${g}, ${esc(S.settings.name||'Jabbaar')} 👋</h1><div class="row sb"><small>Horumarka maanta</small><span class="big">${p}%</span></div>${bar(p)}<small>🔥 ${streak()} maalmood oo isku xigta</small></div>
<div class="grid"><div class="card st"><b>${t.length}</b><span>Wadarta</span></div><div class="card st"><b style="color:var(--ok)">${dn}</b><span>La dhammeeyay</span></div><div class="card st"><b style="color:var(--wr)">${t.length-dn}</b><span>Hadhay</span></div></div>
<h2>Hawlaha hadhay</h2>${pen.length?pen.slice(0,6).map(row).join(''):t.length?empty('🎉','Mashaa Allah! Hawl walba waa dhammaatay','Nasasho wanaagsan, ka dibna u gudub dib-u-eegista habeenka.'):empty('✨','Maanta weli hawl ma jirto','Ku bilow qorsheynta subaxda ama ku dar hawl cusub.',`<button class="btn" data-a="add">+ Hawl cusub</button> <button class="btn g" data-a="samp">Ku dar tusaalayaal</button>`)}
<div class="row" style="margin-top:12px"><button class="btn" data-a="add">+ Hawl</button><button class="btn g" data-a="nav" data-id="morn">🌅 Qorsheyn subax</button><button class="btn g" data-a="nav" data-id="night">🌙 Dib-u-eegis</button></div></div>`},
plan(){const all=on(selD),t=sortT(all.filter(x=>filt==='all'||x.cat==filt)),p=pc(all);
return`<div class="v"><h1>📋 Qorshaha Maalinta</h1><div class="row sb card"><button class="ib" data-a="pv">◀</button><div style="text-align:center"><b>${fmt(selD)}</b>${selD!==TODAY()?`<br><a href="#" data-a="tdy" style="color:var(--pr)">Aad maanta</a>`:''}</div><button class="ib" data-a="nx">▶</button></div>
<div class="card" style="margin:10px 0"><div class="row sb"><span>${all.filter(x=>x.done).length}/${all.length} la dhammeeyay</span><b>${p}%</b></div>${bar(p,1)}</div>
<div class="chips"><button class="${filt==='all'?'on':''}" data-a="fc" data-id="all">Dhammaan</button>${CATS.map((c,i)=>`<button class="${filt==i?'on':''}" data-a="fc" data-id="${i}">${c[1]} ${c[0]}</button>`).join('')}</div>
${t.length?t.map(row).join(''):empty('📝',all.length?'Qaybtan hawl kuma jirto':'Maalintan hawl ma jirto','Riix badhanka + si aad hawl ugu darto.')}<button class="fab" data-a="add" aria-label="Hawl cusub">+</button></div>`},
morn(){const d=TODAY(),g=S.goals[d]||[];
return`<div class="v"><h1>🌅 Qorsheynta Subaxda</h1><div class="card"><p style="margin-top:0;color:var(--mu)">Bismillah. Qor hadafyada ugu muhiimsan ee maanta, kala horee, kadibna ka dhig hawlo.</p><form data-f="goal" class="row" style="flex-wrap:nowrap"><input name="g" maxlength="120" placeholder="Hadafka maanta…" autocomplete="off"><button class="btn">Ku dar</button></form><div class="er" id="ge"></div></div>
<h2>Hadafyada (${g.filter(x=>x.done).length}/${g.length})</h2>${g.length?g.map((x,i)=>`<div class="tk ${x.done?'dn':''}"><button class="ck" data-a="gt" data-id="${x.id}">${x.done?'✓':''}</button><div class="tb"><b>${i+1}. ${esc(x.t)}</b></div><button class="ib" data-a="gu" data-id="${x.id}" title="Kor">↑</button><button class="ib" data-a="gv" data-id="${x.id}" title="Hoos">↓</button><button class="ib" data-a="g2t" data-id="${x.id}" title="Ka dhig hawl">➜📋</button><button class="ib" data-a="gd" data-id="${x.id}">🗑</button></div>`).join(''):empty('🌄','Hadaf weli lama qorin','Bilow maalintaada adigoo qorista 3 hadaf oo muhiim ah.')}</div>`},
night(){const d=TODAY(),t=on(d),r=S.reviews[d]||{},past=Object.keys(S.reviews).filter(k=>k!==d).sort().reverse().slice(0,4);
return`<div class="v"><h1>🌙 Dib-u-eegista Habeenka</h1><div class="card"><div class="row sb"><span>Maanta: ${t.filter(x=>x.done).length}/${t.length} hawlood</span><b>${pc(t)}%</b></div>${bar(pc(t),1)}</div>
<form data-f="night" class="card" style="margin-top:10px"><label>Maxaan guuleystay?</label><textarea name="a" rows="3" maxlength="800">${esc(r.a||'')}</textarea><label>Maxaan seegay?</label><textarea name="m" rows="3" maxlength="800">${esc(r.m||'')}</textarea><label>Maxaan berri hagaajin doonaa?</label><textarea name="i" rows="3" maxlength="800">${esc(r.i||'')}</textarea><div class="er" id="ne"></div><button class="btn">💾 Keydi</button></form>
${past.length?`<h2>Dib-u-eegisyadii hore</h2>`+past.map(k=>`<div class="card" style="margin-bottom:8px"><b>${fmt(k)}</b><p class="nt">✅ ${esc(S.reviews[k].a||'—')}<br>❌ ${esc(S.reviews[k].m||'—')}<br>🔧 ${esc(S.reviews[k].i||'—')}</p></div>`).join(''):''}</div>`},
stat(){const w=days(7),ps=w.map(d=>pc(on(d))),avg=Math.round(ps.reduce((a,b)=>a+b,0)/7),act=w.filter(d=>on(d).some(x=>x.done)).length,m=days(28),best=Math.max(...ps),r30=days(30).flatMap(on);
return`<div class="v"><h1>📊 Falanqayn Toddobaadle</h1><div class="grid"><div class="card st"><b>${avg}%</b><span>Celceliska</span></div><div class="card st"><b>${act}/7</b><span>Maalmo firfircoon</span></div><div class="card st"><b>🔥${streak()}</b><span>Isku xigta</span></div></div>
<h2>7-dii maalmood ee la soo dhaafay</h2><div class="card"><div class="bars">${w.map((d,i)=>`<div><span>${ps[i]}%</span><i data-h="${ps[i]}"></i><span>${DAYS[pd(d).getDay()].slice(0,3)}</span></div>`).join('')}</div><p class="nt">Maalinta ugu fiican: ${best}%</p></div>
<h2>Joogteynta (28 maalmood)</h2><div class="card"><div class="hm">${m.map(d=>{const p=pc(on(d)),has=on(d).length;return`<i title="${d}: ${p}%" style="${has?`background:rgba(0,0,255,${.15+p/130});color:${p>50?'#fff':'inherit'}`:''}">${pd(d).getDate()}</i>`}).join('')}</div></div>
<h2>Qaybaha (30 maalmood)</h2><div class="card">${CATS.map((c,i)=>{const a=r30.filter(t=>t.cat==i),p=pc(a);return`<div class="cb"><span>${c[1]} ${c[0].split(' ')[0]}</span>${bar(p,1)}<em>${a.length?p+'%':'—'}</em></div>`}).join('')}</div></div>`},
cal(){const y=cm.getFullYear(),mo=cm.getMonth(),first=new Date(y,mo,1),n=new Date(y,mo+1,0).getDate(),off=(first.getDay()+6)%7,cells=[...Array(off).fill(''),...Array(n).keys()].map(x=>x===''?'<span></span>':`<button data-a="cd" data-id="${ymd(new Date(y,mo,x+1))}" class="${ymd(new Date(y,mo,x+1))===calSel?'on':''} ${ymd(new Date(y,mo,x+1))===TODAY()?'td':''}">${x+1}${pc(on(ymd(new Date(y,mo,x+1))))>=70?'<u></u>':''}</button>`),t=sortT(on(calSel)),r=S.reviews[calSel];
return`<div class="v"><h1>🗓 Kalandar</h1><div class="card"><div class="row sb" style="margin-bottom:8px"><button class="ib" data-a="mp">◀</button><b>${MON[mo]} ${y}</b><button class="ib" data-a="mn">▶</button></div><div class="cal">${['Isn','Tal','Arb','Kha','Jim','Sab','Axd'].map(x=>`<small>${x}</small>`).join('')}${cells.join('')}</div><p class="nt">Xariiq cagaar ah = maalin 70%+ la dhammeeyay</p></div>
<h2>${fmt(calSel)} · ${pc(t)}%</h2>${t.length?t.map(row).join(''):empty('📅','Maalintan hawl ma jirto','Ku dar hawl maalintan.')}${r?`<div class="card nt">🌙 ${esc(r.a||'—')}</div>`:''}<button class="btn" data-a="add" data-id="${calSel}" style="margin-top:8px">+ Hawl ku dar maalintan</button></div>`},
set(){const th=S.settings.theme;return`<div class="v"><h1>⚙️ Dejinta</h1><form data-f="set" class="card"><label>Magacaaga</label><input name="n" maxlength="30" value="${esc(S.settings.name||'')}"><label>Supabase Project URL</label><input name="cloudUrl" type="url" placeholder="https://xxxxx.supabase.co" value="${esc(S.settings.cloudUrl||'')}"><label>Supabase anon/public key</label><input name="cloudKey" placeholder="eyJ..." value="${esc(S.settings.cloudKey||'')}"><label>Cloud ID (ciwaan sir ah oo aad labadiisa qalab ku isticmaalaysid)</label><input name="cloudId" maxlength="80" placeholder="tusaale: jabbaar-life-os" value="${esc(S.settings.cloudId||'')}"><div class="er" id="se"></div><button class="btn">Keydi &amp; ku xidh</button></form>
<h2>Muuqaalka</h2><div class="chips">${[['auto','🖥 Otomaatig'],['light','☀️ Iftiin'],['dark','🌙 Madow']].map(x=>`<button class="${th===x[0]?'on':''}" data-a="th" data-id="${x[0]}">${x[1]}</button>`).join('')}</div>
<h2>Xogta</h2><div class="row"><button class="btn g" data-a="samp">Ku dar tusaalayaal</button><button class="btn g" data-a="unsamp">Tirtir tusaalayaasha</button><button class="btn g" data-a="exp">⬇ Dhoofi</button><button class="btn g" data-a="imp">⬆ Soo geli</button><button class="btn d" data-a="rst">Tirtir wax walba</button></div><input type="file" id="imp" accept=".json" hidden></div>`}};
function apply(){const t=S.settings.theme;document.documentElement.dataset.t=t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t}
function render(){apply();$('#main').innerHTML=V[view]();const nv=NAV.map(n=>`<button class="nv ${n[0]===view?'on':''}" data-a="nav" data-id="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');$('#bn').innerHTML=nv;$('#sn').innerHTML=nv;
setTimeout(()=>{document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');document.querySelectorAll('[data-h]').forEach(e=>e.style.height=e.dataset.h+'%')},40);
$('#mdl').innerHTML=modal?`<div class="ov" data-a="cls"><form class="md" data-f="task" onclick="event.stopPropagation()"><h1>${modal.id?'Wax ka beddel hawsha':'Hawl cusub'}</h1><label>Cinwaanka *</label><input name="title" maxlength="100" value="${esc(modal.title||'')}" autofocus><div class="er" id="te"></div><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label>Qaybta</label><select name="cat">${CATS.map((c,i)=>`<option value="${i}" ${modal.cat==i?'selected':''}>${c[1]} ${c[0]}</option>`).join('')}</select></div><div style="flex:1"><label>Mudnaanta</label><select name="pri">${PR.map((p,i)=>`<option value="${i}" ${modal.pri==i?'selected':''}>${p}</option>`).join('')}</select></div></div><div class="row" style="flex-wrap:nowrap"><div style="flex:1"><label>Waqti (ikhtiyaar)</label><input type="time" name="time" value="${modal.time||''}"></div><div style="flex:1"><label>Taariikh</label><input type="date" name="date" value="${modal.date}"></div></div><label>Qoraal (ikhtiyaar)</label><textarea name="notes" rows="2" maxlength="400">${esc(modal.notes||'')}</textarea><div class="row" style="margin-top:14px"><button class="btn">Keydi</button><button type="button" class="btn g" data-a="cls">Jooji</button></div></form></div>`:'';
if(modal)setTimeout(()=>{const i=document.querySelector('[name=title]');i&&i.focus()},50)}
const find=id=>S.tasks.find(t=>t.id===id),goals=()=>S.goals[TODAY()]||(S.goals[TODAY()]=[]);
const A={nav:id=>{view=id;scrollTo(0,0)},cls:()=>modal=null,
add:id=>modal={date:id||(view==='plan'?selD:TODAY()),cat:0,pri:1},
ed:id=>modal={...find(id)},tg:id=>{const t=find(id);t.done=!t.done;save()},
dl:id=>{if(confirm('Ma tirtirtaa hawshan?')){S.tasks=S.tasks.filter(t=>t.id!==id);save();toast('Waa la tirtiray')}},
pv:()=>{const d=pd(selD);d.setDate(d.getDate()-1);selD=ymd(d)},nx:()=>{const d=pd(selD);d.setDate(d.getDate()+1);selD=ymd(d)},tdy:()=>selD=TODAY(),fc:id=>filt=id,
mp:()=>cm=new Date(cm.getFullYear(),cm.getMonth()-1,1),mn:()=>cm=new Date(cm.getFullYear(),cm.getMonth()+1,1),cd:id=>calSel=id,
gt:id=>{const g=goals().find(x=>x.id===id);g.done=!g.done;save()},gd:id=>{S.goals[TODAY()]=goals().filter(x=>x.id!==id);save()},
gu:id=>mv(id,-1),gv:id=>mv(id,1),
g2t:id=>{const g=goals().find(x=>x.id===id);S.tasks.push({id:uid(),title:g.t,cat:0,pri:2,time:'',notes:'',date:TODAY(),done:false});save();toast('Waxaa lagu daray qorshaha ✓')},
th:id=>{S.settings.theme=id;save()},
samp:()=>{const d=TODAY();[['Salaadda Fajr',0,'05:30',2],['Akhri 1 bog oo Quraan ah',1,'06:00',2],['Dib u eeg casharka',2,'09:00',1],['Jawaab macaamiisha',3,'11:00',1],['Naqshadee logo cusub',4,'14:00',2],['Tafatir muuqaal gaaban',5,'16:00',1],['Jimicsi 30 daqiiqo',6,'17:30',1],['Wac waalidka',7,'19:00',0],['Akhri 10 bog buug',8,'21:00',0]].forEach(x=>S.tasks.push({id:uid(),s:1,title:x[0],cat:x[1],time:x[2],pri:x[3],notes:'',date:d,done:false}));save();toast('Tusaalayaal waa la daray')},
unsamp:()=>{S.tasks=S.tasks.filter(t=>!t.s);save();toast('Tusaalayaasha waa la tirtiray')},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='jabbaar-life-os-'+TODAY()+'.json';a.click()},
imp:()=>$('#imp').click(),
rst:()=>{if(confirm('Xogta oo dhan waa la tirtiri doonaa. Ma hubtaa?')){S={tasks:[],goals:{},reviews:{},settings:{theme:'auto',name:'Jabbaar'}};save();toast('Waa la nadiifiyay')}}};
function mv(id,d){const g=goals(),i=g.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=g.length)return;[g[i],g[j]]=[g[j],g[i]];save()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||!A[b.dataset.a])return;e.preventDefault();const a=b.dataset.a;A[a](b.dataset.id);if(a!=='exp'&&a!=='imp')render()});
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.tasks||!Array.isArray(o.tasks))throw 0;S={goals:{},reviews:{},settings:{theme:'auto',name:'Jabbaar'},...o};save();render();toast('Xogta waa la soo geliyay')}catch(x){toast('Faylku sax ma aha')}};r.readAsText(f)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f,d=Object.fromEntries(new FormData(f));
if(k==='task'){const ti=d.title.trim();if(ti.length<2){$('#te').textContent='Fadlan geli cinwaan (ugu yaraan 2 xaraf)';return}if(!d.date){$('#te').textContent='Taariikh dooro';return}
const o={title:ti,cat:+d.cat,pri:+d.pri,time:d.time,date:d.date,notes:d.notes.trim()};if(modal.id)Object.assign(find(modal.id),o);else S.tasks.push({id:uid(),done:false,...o});save();modal=null;toast('Waa la keydiyay ✓')}
if(k==='goal'){const g=d.g.trim();if(g.length<2){$('#ge').textContent='Fadlan qor hadaf (ugu yaraan 2 xaraf)';return}goals().push({id:uid(),t:g,done:false});save()}
if(k==='night'){if(!(d.a+d.m+d.i).trim()){$('#ne').textContent='Fadlan ugu yaraan hal su\'aal ka jawaab';return}S.reviews[TODAY()]={a:d.a.trim(),m:d.m.trim(),i:d.i.trim()};save();toast('Dib-u-eegista waa la keydiyay 🌙')}
if(k==='set'){if(d.n.trim().length<1){$('#se').textContent='Magac geli';return}S.settings.name=d.n.trim();S.settings.cloudUrl=d.cloudUrl.trim();S.settings.cloudKey=d.cloudKey.trim();S.settings.cloudId=d.cloudId.trim();save();if(S.settings.cloudUrl&&S.settings.cloudKey&&S.settings.cloudId){pullCloud();toast('Waa la keydiyay ✓') }else toast('Waa la keydiyay ✓')}
render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',apply);
render();
if(initCloud())pullCloud();
</script></body></html>
